name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout repo chính vào thư mục core
      - name: Check out main site
        uses: actions/checkout@v5
        with:
          path: core

      # Checkout các repo nội dung (Bỏ dòng token nếu repo là public)
      - name: Check out stories content
        uses: actions/checkout@v5
        with:
          repository: vuongthm/stories
          path: stories
          # token: ${{ secrets.PAT_TOKEN }}  # Mở dòng này nếu repo stories là PRIVATE
        continue-on-error: true

      - name: Check out network-notes content
        uses: actions/checkout@v5
        with:
          repository: vuongthm/network-notes
          path: network-notes
          # token: ${{ secrets.PAT_TOKEN }}  # Mở dòng này nếu repo network-notes là PRIVATE
        continue-on-error: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      # Quan trọng: Cài đặt và Build bên trong thư mục 'core'
      - name: Install dependencies
        working-directory: ./core
        run: pnpm install --frozen-lockfile

      - name: Build site
        working-directory: ./core
        run: pnpm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./core/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4