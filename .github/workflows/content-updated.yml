name: Receive content update
on:
  push:
    branches: ["content-updates/**"]
permissions:
  actions: write
  contents: write
jobs:
  rebuild:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    steps:
      - name: Build canonical website branch
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'quality-and-pages.yml',
              ref: 'main'
            });
      - name: Remove processed notification branch
        uses: actions/github-script@v8
        with:
          script: |
            const prefix = 'refs/heads/content-updates/';
            if (!context.ref.startsWith(prefix)) throw new Error('Unexpected notification ref');
            const ref = context.ref.slice('refs/'.length);
            const parameters = { owner: context.repo.owner, repo: context.repo.repo, ref };
            try {
              const current = await github.rest.git.getRef(parameters);
              // A later push owns its own cleanup; never delete that newer notification.
              if (current.data.object.sha === context.sha) {
                await github.rest.git.deleteRef(parameters);
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
