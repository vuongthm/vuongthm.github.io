name: Receive content update
on:
  push:
    branches: ["content-updates/**"]
permissions:
  actions: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Build canonical website branch
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'quality-and-pages.yml',
              ref: 'main'
            });
